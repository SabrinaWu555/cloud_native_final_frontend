# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint || true   # lint 失敗暫時不擋（之後可以拿掉 || true）

      - name: Build Next.js
        run: npm run build
        env:
          # build 階段給假值就好，反正只是檢查能不能 compile
          IAM_URL: http://placeholder:8000/iam
          NOTIFICATION_URL: http://placeholder:8000/notification
          RECOMMENDATION_URL: http://placeholder:8000/notification
          BILLING_URL: http://placeholder:8000/billing
          APPEAL_URL: http://placeholder:8000/appeal-admin
          VENDOR_URL: http://placeholder:8000
          ORDER_URL: http://placeholder:8000
          USE_LOCAL_MOCKS: 'false'

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t employee-frontend:${{ github.sha }} .