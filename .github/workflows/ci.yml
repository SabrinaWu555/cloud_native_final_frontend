name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Build Next.js
        run: npm run build
        env:
          IAM_URL: http://placeholder:8000/iam
          NOTIFICATION_URL: http://placeholder:8000/notification
          RECOMMENDATION_URL: http://placeholder:8000/recommendation
          BILLING_URL: http://placeholder:8000/billing
          APPEAL_URL: http://placeholder:8000/appeal-admin
          VENDOR_URL: http://placeholder:8000
          ORDER_URL: http://placeholder:8000
          USE_LOCAL_MOCKS: "false"

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cloud-native-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cloud-native-frontend:${{ github.sha }}

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cloud-native-frontend:latest

            docker stop frontend 2>/dev/null || true
            docker rm frontend 2>/dev/null || true

            docker run -d \
              --name frontend \
              --restart unless-stopped \
              -p 3000:3000 \
              -e IAM_URL=http://32.236.51.177:8000/iam \
              -e NOTIFICATION_URL=http://32.236.51.177:8000/notification \
              -e RECOMMENDATION_URL=http://32.236.51.177:8000/recommendation \
              -e BILLING_URL=http://32.236.51.177:8000/billing \
              -e APPEAL_URL=http://32.236.51.177:8000/appeal-admin \
              -e VENDOR_URL=http://32.236.51.177:8000 \
              -e ORDER_URL=http://54.66.51.3:8081 \
              -e AUTH_COOKIE_NAME=token \
              -e AUTH_ROLE_COOKIE_NAME=role \
              -e AUTH_COOKIE_MAX_AGE=28800 \
              -e USE_LOCAL_MOCKS=false \
              -e COOKIE_SECURE=false \
              -e NODE_ENV=production \
              ${{ secrets.DOCKERHUB_USERNAME }}/cloud-native-frontend:latest

            docker ps | grep frontend
